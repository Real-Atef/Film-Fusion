<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a Film Fusion account.">
  <title>Sign Up - Film Fusion</title>
  <link rel="icon" href="../Images/Logo2.png">
  <link rel="stylesheet" href="../CSS/common.css">
  <link rel="stylesheet" href="../CSS/Sign-up.css">
</head>
<body>
  <header>
    <nav>
      <div class="logo">
        <a href="../Home.html"><img src="../Images/Logo_colored.png" alt="Film Fusion"></a>
      </div>
      <button class="menu-toggle" onclick="toggleMenu()"><span></span><span></span><span></span></button>
      <ul class="nav-links" id="navLinks">
        <li><a href="movies.html">Movies</a></li>
        <li><a href="series.html">Series</a></li>
        <li><a href="watchlist.html">Watchlist</a></li>
        <li><a href="About-us.html">About</a></li>
      </ul>
      <a href="Sign-in.html" class="profile-btn"><img src="../Images/PersonCircle-removebg-preview.png" alt="Account"></a>
    </nav>
  </header>

  <main class="auth-page">
    <form class="auth-card" id="signupForm" novalidate>
      <h1>Create Account</h1>
      <p class="subtitle">Join Film Fusion today</p>
      
      <div class="success-msg" id="successMsg"></div>
      
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" name="firstName" placeholder="John" required>
          <span class="form-error" id="firstNameError"></span>
        </div>
        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" name="lastName" placeholder="Doe" required>
          <span class="form-error" id="lastNameError"></span>
        </div>
      </div>
      
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
        <span class="form-error" id="emailError"></span>
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6">
        <span class="form-error" id="passwordError"></span>
      </div>
      
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" required>
        <span class="form-error" id="confirmPasswordError"></span>
      </div>
      
      <button type="submit" class="submit-btn">Create Account</button>
      
      <p class="auth-footer">Already have an account? <a href="Sign-in.html">Sign in</a></p>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Film Fusion. All rights reserved.</p>
  </footer>

  <script src="../JS/config.js"></script>
  <script src="../JS/auth.js"></script>
  <script>
    function toggleMenu() { document.getElementById('navLinks').classList.toggle('active'); }
    document.addEventListener('DOMContentLoaded', () => {
      initAuth('signup');
      if (isLoggedIn()) window.location.href = getHomePath();
    });
  </script>
</body>
</html>
