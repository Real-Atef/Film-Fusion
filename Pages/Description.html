<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View movie and TV series details on Film Fusion.">
  <title>Film Fusion</title>
  <link rel="icon" href="../Images/Logo2.png">
  <link rel="stylesheet" href="../CSS/common.css">
  <link rel="stylesheet" href="../CSS/Description.css">
</head>
<body>
  <header>
    <nav>
      <div class="logo">
        <a href="../Home.html"><img src="../Images/Logo_colored.png" alt="Film Fusion"></a>
      </div>
      <button class="menu-toggle" onclick="toggleMenu()"><span></span><span></span><span></span></button>
      <ul class="nav-links" id="navLinks">
        <li><a href="movies.html">Movies</a></li>
        <li><a href="series.html">Series</a></li>
        <li><a href="watchlist.html">Watchlist</a></li>
        <li><a href="About-us.html">About</a></li>
      </ul>
      <div class="search-box">
        <input type="search" id="searchInput" placeholder="Search..." autocomplete="off">
        <button onclick="search()">Search</button>
      </div>
      <a href="Sign-in.html" class="profile-btn"><img src="../Images/PersonCircle-removebg-preview.png" alt="Account"></a>
    </nav>
  </header>

  <main class="detail-page">
    <h1 class="detail-title" id="title">Loading...</h1>
    
    <div class="detail-hero">
      <img class="detail-poster" id="poster" src="" alt="Poster">
      <iframe class="detail-trailer" id="trailer" src="" allowfullscreen></iframe>
    </div>
    
    <div class="detail-actions" id="actions"></div>
    
    <!-- Share Buttons -->
    <div class="share-buttons" id="shareButtons"></div>
    
    <p class="detail-synopsis" id="synopsis"></p>
    
    <div class="detail-info" id="info"></div>
    
    <!-- Where to Watch -->
    <section class="watch-providers" id="watchProviders" style="display:none;">
      <h3 class="detail-section-title">Where to Watch</h3>
      <div class="providers-grid" id="providersGrid"></div>
    </section>
    
    <!-- Box Office -->
    <section class="box-office" id="boxOffice" style="display:none;">
      <h3 class="detail-section-title">Box Office</h3>
      <div class="box-office-grid" id="boxOfficeGrid"></div>
    </section>
    
    <h3 class="detail-section-title">Top Cast</h3>
    <div class="cast-grid" id="cast"></div>
    
    <!-- Videos Gallery -->
    <section class="videos-section" id="videosSection" style="display:none;">
      <h3 class="detail-section-title">Videos & Trailers</h3>
      <div class="videos-row" id="videosRow"></div>
    </section>
    
    <!-- Images Gallery -->
    <section class="images-section" id="imagesSection" style="display:none;">
      <h3 class="detail-section-title">Images</h3>
      <div class="images-row" id="imagesRow"></div>
    </section>
    
    <section class="similar-section" id="similarSection">
      <h3 class="detail-section-title">You May Also Like</h3>
      <div class="similar-row" id="similarRow"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Film Fusion. All rights reserved.</p>
  </footer>

  <script src="../JS/config.js"></script>
  <script src="../JS/Description.js"></script>
  <script>
    function toggleMenu() { document.getElementById('navLinks').classList.toggle('active'); }
    function search() {
      const q = document.getElementById('searchInput').value.trim();
      if (q) window.location.href = `search-results.html?q=${encodeURIComponent(q)}`;
    }
    document.getElementById('searchInput').addEventListener('keypress', e => { if (e.key === 'Enter') search(); });
  </script>
</body>
</html>
