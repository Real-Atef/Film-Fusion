<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to Film Fusion.">
  <title>Sign In - Film Fusion</title>
  <link rel="icon" href="../Images/Logo2.png">
  <link rel="stylesheet" href="../CSS/common.css">
  <link rel="stylesheet" href="../CSS/Sign-in.css">
</head>
<body>
  <header>
    <nav>
      <div class="logo">
        <a href="../Home.html"><img src="../Images/Logo_colored.png" alt="Film Fusion"></a>
      </div>
      <button class="menu-toggle" onclick="toggleMenu()"><span></span><span></span><span></span></button>
      <ul class="nav-links" id="navLinks">
        <li><a href="movies.html">Movies</a></li>
        <li><a href="series.html">Series</a></li>
        <li><a href="watchlist.html">Watchlist</a></li>
        <li><a href="About-us.html">About</a></li>
      </ul>
      <a href="Sign-up.html" class="profile-btn"><img src="../Images/PersonCircle-removebg-preview.png" alt="Account"></a>
    </nav>
  </header>

  <main class="auth-page">
    <form class="auth-card" id="signinForm" novalidate>
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to access your watchlist</p>
      
      <div class="success-msg" id="successMsg"></div>
      
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
        <span class="form-error" id="emailError"></span>
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Your password" required>
        <span class="form-error" id="passwordError"></span>
      </div>
      
      <a href="#" class="forgot-link" onclick="alert('Password reset would require a backend.'); return false;">Forgot password?</a>
      
      <button type="submit" class="submit-btn">Sign In</button>
      
      <p class="auth-footer">Don't have an account? <a href="Sign-up.html">Sign up</a></p>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Film Fusion. All rights reserved.</p>
  </footer>

  <script src="../JS/config.js"></script>
  <script src="../JS/auth.js"></script>
  <script>
    function toggleMenu() { document.getElementById('navLinks').classList.toggle('active'); }
    document.addEventListener('DOMContentLoaded', () => {
      initAuth('signin');
      if (isLoggedIn()) window.location.href = getHomePath();
    });
  </script>
</body>
</html>
